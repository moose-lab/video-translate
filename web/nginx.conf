# Same-origin web gateway. Terminate HTTPS at a trusted edge and make the API
# available as `api:8000` on the private container network.
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    upstream video_translate_api { server api:8000; }

    server {
        listen 8080;
        server_name _;
        root /srv/video-translate/web/dist;
        index index.html;
        disable_symlinks on;
        # 512 MiB default upload plus multipart overhead. Raise together with
        # VT_UPLOAD_MAX_BYTES when configuring a larger supported upload.
        client_max_body_size 520m;

        # Reject encoded or literal parent-path segments before URI normalization
        # can send an API-looking traversal request into the SPA fallback.
        if ($request_uri ~* "^/[^?]*(?:/|%2f)(?:\\.|%2e){2}(?:/|%2f|\\?|$)") {
            return 400;
        }
        if ($uri ~ "(^|/)\\.") { return 404; }

        location = /api {
            proxy_pass http://video_translate_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /api/ {
            proxy_pass http://video_translate_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
        # Missing fingerprinted assets must remain 404, never index.html.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
