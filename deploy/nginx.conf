# Template rendered by the image entrypoint. The operator supplies one exact edge
# IP/CIDR; blank configuration fails Compose admission. Never use 0.0.0.0/0 or ::/0.
log_format vt_proxy '$remote_addr edge_peer=$realip_remote_addr [$time_local] "$request" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 513m;
    set_real_ip_from ${VT_TRUSTED_EDGE_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    access_log /dev/stdout vt_proxy;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # $remote_addr is rewritten only for the configured edge socket peer.
        # Discard client-supplied chains rather than appending them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 650s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
